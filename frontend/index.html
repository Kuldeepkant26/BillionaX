<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/logo.png" />
    <link rel="apple-touch-icon" href="/logo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#FFFFFF" />
    <meta name="description" content="Billionax — turn every hotel bill into coins you can spend on the spot." />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!--
      Every font preset's faces, in one request.

      All of them rather than just the active one, for two reasons: the admin's
      font picker previews each option in its OWN typeface, and switching
      presets is then instant with no flash of fallback text. `display=swap`
      keeps text visible while the faces download. Keep this list in step with
      theme/fontPresets.js — FONT_STYLESHEET_HREF there builds the same URL,
      and tests/fontPreset.test.js asserts the two agree.
    -->
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Schibsted+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600;700;800&family=Playfair+Display:wght@400;500;600;700&family=Lato:wght@400;700&family=Cormorant+Garamond:wght@400;500;600;700&family=Jost:wght@400;500;600;700&family=Nunito:wght@400;600;700;800&family=Nunito+Sans:wght@400;600;700&family=Space+Grotesk:wght@400;500;600;700&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />

    <title>Billionax · Wave Coins</title>
  </head>
  <body>
    <script>
      /*
       * Applies the saved guest theme BEFORE first paint.
       *
       * useThemeRoot runs in a useEffect, i.e. after hydration and after
       * zustand rehydrates from localStorage — far too late. Without this, a
       * dark-mode guest gets a white flash on every cold load, which is
       * exactly when dark mode matters most.
       *
       * It reads the persisted key directly rather than importing the store,
       * because any module import would be deferred past paint. It also has to
       * live in <body>, not <head>: document.body does not exist yet up there.
       */
      (function () {
        try {
          var raw = localStorage.getItem("gw-storage");
          var state = (raw && JSON.parse(raw).state) || {};

          var theme = state.guestTheme;
          if (theme !== "emerald-noir" && theme !== "lumen") theme = "lumen";

          // The admin-chosen colour preset. Hardcoded allowlist rather than an
          // import: any module import would be deferred past paint. Keep in
          // step with theme/accentPresets.js.
          var accent = state.accent;
          var accents = [
            "SAND", "LAVENDER", "TEAL", "ROSE", "SAGE", "CLAY",
            "CHAMPAGNE", "EMERALD", "OBSIDIAN", "BURGUNDY", "ONYX_JADE", "PLUM",
            "LINEN", "MIST", "BLUSH", "MEADOW",
            "CORAL", "INDIGO", "SAFFRON", "FUCHSIA", "VIRIDIAN",
            "OCEAN", "MIDNIGHT", "MONO", "SLATE", "FOREST", "CUSTOM"
          ];
          if (accents.indexOf(accent) === -1) accent = "CORAL";

          // Guest routes take the saved light/dark theme; every other route
          // is a panel or the staff login and paints ink-minimal — set here
          // too, so panel cold loads do not flash unthemed.
          var path = location.pathname;
          var isGuest =
            path === "/" ||
            path.indexOf("/app") === 0 ||
            path.indexOf("/join") === 0 ||
            path === "/login";

          // The admin-chosen typeface. Same hardcoded-allowlist reasoning as
          // the accent above. Keep in step with theme/fontPresets.js.
          var font = state.font;
          var fonts = [
            "EDITORIAL", "MODERN", "CLASSIC", "LUXE", "SOFT", "TECHNICAL", "SYSTEM"
          ];
          if (fonts.indexOf(font) === -1) font = "EDITORIAL";

          document.body.setAttribute("data-theme", isGuest ? theme : "ink-minimal");
          document.body.setAttribute("data-accent", accent);
          document.body.setAttribute("data-font", font);

          var meta = document.querySelector('meta[name="theme-color"]');
          if (meta && isGuest) {
            meta.setAttribute("content", theme === "emerald-noir" ? "#0B0A08" : "#FFFFFF");
          } else if (meta) {
            meta.setAttribute("content", "#F5F6F8");
          }
        } catch (e) {
          /* A blocked or malformed localStorage must not stop the app booting. */
        }
      })();
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
